<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Produtos - Cupcake Store</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark shadow">
      <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">🧁 Cupcake Store</a>
        <div class="ms-auto d-flex gap-3">
          <a class="nav-link" th:href="@{/}">Início</a
          ><a class="nav-link" th:href="@{/carrinho}"
            >Carrinho</a
          >
        </div>
      </div>
    </nav>
    <div class="container mt-5">
      <h2 class="text-center mb-4">Nossos Cupcakes</h2>
      <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
      <div class="row">
        <div class="col-md-4 mb-4" th:each="produto : ${produtos}">
          <div class="card cupcake-card h-100 shadow-sm">
            <div
              class="produto-placeholder d-flex align-items-center justify-content-center"
            >
              🧁
            </div>
            <div class="card-body d-flex flex-column">
              <h5 class="card-title" th:text="${produto.nome}">Nome</h5>
              <p class="card-text" th:text="${produto.descricao}">Descrição</p>
              <h4 class="text-success mt-auto">
                R$
                <span
                  th:text="${#numbers.formatDecimal(produto.preco,1,'POINT',2,'COMMA')}"
                  >0,00</span
                >
              </h4>
              <p class="text-muted">
                Estoque: <span th:text="${produto.estoque}">0</span>
              </p>
              <a
                class="btn btn-cupcake w-100"
                th:href="@{/carrinho/adicionar/{id}(id=${produto.id})}"
                >Adicionar ao Carrinho</a
              >
            </div>
          </div>
        </div>
      </div>
    </div>
    <footer class="footer mt-5">
      <div class="container text-center py-3">
        <p class="mb-0">&copy; 2026 Cupcake Store</p>
      </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/script.js}"></script>
  </body>
</html>
