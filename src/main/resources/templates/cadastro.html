<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cadastro - Cupcake Store</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark shadow">
      <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">🧁 Cupcake Store</a>
        <div class="ms-auto d-flex gap-3">
          <a class="nav-link" th:href="@{/}">Início</a
          ><a class="nav-link" th:href="@{/login}">Login</a>
        </div>
      </div>
    </nav>
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-7">
          <div class="card shadow">
            <div class="card-header text-center">
              <h3>Cadastro de Cliente</h3>
            </div>
            <div class="card-body">
              <div
                th:if="${sucesso}"
                class="alert alert-success"
                th:text="${sucesso}"
              ></div>
              <div
                th:if="${erro}"
                class="alert alert-danger"
                th:text="${erro}"
              ></div>
              <form
                th:action="@{/cadastro}"
                th:object="${cliente}"
                method="post"
                data-validar="true"
              >
                <div class="mb-3">
                  <label class="form-label">Nome</label
                  ><input
                    type="text"
                    class="form-control"
                    th:field="*{nome}"
                    required
                  />
                  <div
                    class="text-danger"
                    th:if="${#fields.hasErrors('nome')}"
                    th:errors="*{nome}"
                  ></div>
                </div>
                <div class="mb-3">
                  <label class="form-label">E-mail</label
                  ><input
                    type="email"
                    class="form-control"
                    th:field="*{email}"
                    required
                  />
                  <div
                    class="text-danger"
                    th:if="${#fields.hasErrors('email')}"
                    th:errors="*{email}"
                  ></div>
                </div>
                <div class="mb-4">
                  <label class="form-label">Senha</label
                  ><input
                    type="password"
                    class="form-control"
                    th:field="*{senha}"
                    required
                  />
                  <div
                    class="text-danger"
                    th:if="${#fields.hasErrors('senha')}"
                    th:errors="*{senha}"
                  ></div>
                </div>
                <div class="d-grid">
                  <button type="submit" class="btn btn-cupcake">
                    Cadastrar
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
    <footer class="footer mt-5">
      <div class="container text-center py-3">
        <p class="mb-0">&copy; 2026 Cupcake Store</p>
      </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/script.js}"></script>
  </body>
</html>
