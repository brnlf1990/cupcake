<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Carrinho - Cupcake Store</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark shadow">
      <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">🧁 Cupcake Store</a>
        <div class="ms-auto d-flex gap-3">
          <a class="nav-link" th:href="@{/produtos}">Produtos</a
          ><a class="nav-link" th:href="@{/}">Início</a>
        </div>
      </div>
    </nav>
    <div class="container mt-5">
      <h2 class="mb-4 text-center">Meu Carrinho</h2>
      <div
        th:if="${sucesso}"
        class="alert alert-success"
        th:text="${sucesso}"
      ></div>
      <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
      <div th:if="${#lists.isEmpty(itens)}" class="alert alert-info">
        Seu carrinho está vazio.
      </div>
      <div th:unless="${#lists.isEmpty(itens)}" class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
          <thead class="table-light">
            <tr>
              <th>Produto</th>
              <th>Preço</th>
              <th>Quantidade</th>
              <th>Subtotal</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="item, status : ${itens}">
              <td th:text="${item.produto.nome}">Produto</td>
              <td>
                R$
                <span
                  th:text="${#numbers.formatDecimal(item.precoUnitario,1,'POINT',2,'COMMA')}"
                  >0,00</span
                >
              </td>
              <td th:text="${item.quantidade}">1</td>
              <td>
                R$
                <span
                  th:text="${#numbers.formatDecimal(item.subtotal,1,'POINT',2,'COMMA')}"
                  >0,00</span
                >
              </td>
              <td>
                <a
                  class="btn btn-danger btn-sm"
                  th:href="@{/carrinho/remover/{indice}(indice=${status.index})}"
                  >Remover</a
                >
              </td>
            </tr>
          </tbody>
        </table>
        <div class="d-flex justify-content-between align-items-center">
          <h4>
            Total: R$
            <span th:text="${#numbers.formatDecimal(total,1,'POINT',2,'COMMA')}"
              >0,00</span
            >
          </h4>
          <a class="btn btn-success" th:href="@{/pedido}">Finalizar Pedido</a>
        </div>
      </div>
    </div>
    <footer class="footer mt-5">
      <div class="container text-center py-3">
        <p class="mb-0">&copy; 2026 Cupcake Store</p>
      </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/script.js}"></script>
  </body>
</html>
